name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spark/requirements.txt
      - run: pip install -r spark/requirements.txt
      - run: python -m pytest -q spark/tests

  airflow-dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__PLUGINS_FOLDER: ${{ github.workspace }}/airflow/plugins
      PYTHONPATH: ${{ github.workspace }}/airflow/dags:${{ github.workspace }}/airflow/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "apache-airflow[celery,postgres,smtp,fab,slack]==3.3.2" pandas --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"
      - name: Parse the DAG folder
        run: |
          python - <<'PY'
          import os
          from airflow.models.dagbag import DagBag
          bag = DagBag(os.environ["AIRFLOW__CORE__DAGS_FOLDER"])
          for path, err in bag.import_errors.items():
              print(f"::error file={path}::{err}")
          print("DAGs:", sorted(bag.dag_ids))
          assert not bag.import_errors, "DAG import errors"
          assert {"daily_etl_pipeline"} <= set(bag.dag_ids)
          PY
      - name: DAG structure checks
        run: python airflow/test_dag_structure.py

  dbt-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      DWH_POSTGRES_HOST: localhost
      DWH_POSTGRES_USER: postgres
      DWH_POSTGRES_PASSWORD: postgres
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-postgres==1.9.1" "psycopg[binary]"
      - name: Create warehouse schema and seed sample data
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/schema_init.sql
          psql -v ON_ERROR_STOP=1 -q -d ecommerce -f sql/seed_sample_data.sql
      - name: dbt build
        working-directory: dbt
        run: |
          dbt deps
          dbt build
      - name: Export dashboard data
        run: python dashboard/export.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy-dashboard:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: dbt-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
