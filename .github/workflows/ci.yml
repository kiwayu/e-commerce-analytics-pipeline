name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spark/requirements.txt
      - run: pip install -r spark/requirements.txt
      - run: python -m pytest -q spark/tests
