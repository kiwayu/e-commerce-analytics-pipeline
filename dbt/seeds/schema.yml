version: 2

seeds:
  - name: fx_rates
    description: Rates used to express every order and shipment amount in the base currency (see vars.base_currency).
    config:
      column_types:
        currency: varchar(3)
        rate_to_base: numeric(12, 6)
    columns:
      - name: currency
        tests:
          - unique
          - not_null
      - name: rate_to_base
        tests:
          - not_null
